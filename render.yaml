services:
  - type: web
    name: kolaru
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: MAX_BOTS
        value: 0
      - key: AUTO_JOIN
        value: false
      - key: BOT_TOKENS
        value: ""
      - key: VOICE_CHANNEL_IDS
        value: ""
